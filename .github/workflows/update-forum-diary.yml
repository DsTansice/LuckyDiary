name: Update forum diary

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 15 * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Fetch forum posts
        run: python scraper.py
        env:
          FORUM_USERNAME: ${{ secrets.FORUM_USERNAME }}
          FORUM_PASSWORD: ${{ secrets.FORUM_PASSWORD }}
          FORUM_QUESTION_ID: ${{ secrets.FORUM_QUESTION_ID }}
          FORUM_ANSWER: ${{ secrets.FORUM_ANSWER }}
          FORUM_COOKIE: ${{ secrets.FORUM_COOKIE }}

      - name: Build static site
        run: python site_generator.py

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json dist/index.html dist/styles.css dist/app.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh diary archive"
            git push
          fi
